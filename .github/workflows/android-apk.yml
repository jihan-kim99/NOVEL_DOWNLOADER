name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build static web bundle and sync Capacitor Android
        run: yarn build:android

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        working-directory: ./android

      - name: Assemble Android APK
        run: ./gradlew assembleDebug
        working-directory: ./android

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NovelDownloader.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovelDownloader-Android-APK
          path: NovelDownloader.apk
          retention-days: 30
